name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Read package version
        id: pkg
        run: |
          node -e "const p=require('./package.json');console.log('version='+p.version);require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT,'version='+p.version+'\n')"

      - name: Check the release tag matches package.json
        if: github.event_name == 'release'
        run: |
          node -e "const p=require('./package.json');const t=process.env.GITHUB_REF_NAME.replace(/^v/,'');if(p.version!==t){console.error('package.json '+p.version+' does not match tag '+t);process.exit(1)};console.log('tag '+t+' matches package.json')"

      - name: Skip when this version is already on npm
        id: exists
        run: |
          if npm view "dsh-sensitive-replace@${{ steps.pkg.outputs.version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "dsh-sensitive-replace@${{ steps.pkg.outputs.version }} is already published - nothing to do"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.exists.outputs.exists == 'false'
        run: npm install --no-audit --no-fund

      - if: steps.exists.outputs.exists == 'false'
        name: Run tests
        run: npm test

      - if: steps.exists.outputs.exists == 'false'
        name: Publish to npm (OIDC trusted publisher, no token)
        run: npm publish
